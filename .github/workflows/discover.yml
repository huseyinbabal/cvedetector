# Weekly: finds images people run (top Artifact Hub charts, Docker Official
# Images, Bitnami) that the feed doesn't map yet, matches them to NVD products
# and opens a pull request with the proposals for a human to review.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". Optional secret NVD_API_KEY (10x faster).
# Note: pull requests opened with GITHUB_TOKEN don't trigger other workflows,
# so the PR body carries the report instead of the `catalog` check.
# The catalog is on the data branch, so the PR targets `data`.
name: discover

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      max:
        description: Maximum candidates to look up
        default: "400"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check out the data branch (catalog)
        run: |
          git fetch --depth=1 origin data
          git worktree add -B data data FETCH_HEAD
      # NVD answers are cached between runs: only new candidates are looked up.
      - uses: actions/cache/restore@v4
        with:
          path: .discover-cache.json
          key: discover-${{ github.run_id }}
          restore-keys: discover-
      - name: Discover
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./tools/feedgen/discover -products data/catalog -max "${{ inputs.max || 400 }}" \
            -cache .discover-cache.json -report "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .discover-cache.json
          key: discover-${{ github.run_id }}
      - name: Validate
        run: go run ./tools/feedgen -config data/catalog -validate
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: data
        run: |
          if [ -z "$(git status --porcelain -- catalog)" ]; then
            echo "Nothing new." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="discover/$(date -u +%F)"
          git switch -c "$branch"
          git add catalog
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "feed: discovered products $(date -u +%F)"
          git push -f origin "$branch"
          head -c 60000 "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/body.md"
          printf '\n\n---\nGenerated by the `discover` workflow. Matches are by product name: check each CPE before merging; delete files that are wrong.\n' >> "$RUNNER_TEMP/body.md"
          gh pr create --base data --head "$branch" --title "Discovered products $(date -u +%F)" --body-file "$RUNNER_TEMP/body.md" \
            || gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
