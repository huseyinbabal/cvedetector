id: postgresql
name: "PostgreSQL"
images:
  - docker.io/library/postgres
  - docker.io/bitnami/postgresql
  - ghcr.io/cloudnative-pg/postgresql
minSegments: 2
nvd:
  cpes:
    - cpe:2.3:a:postgresql:postgresql
# Example tags and the version that must be read from them ("" = none).
testTags:
  "17.2-alpine": "17.2"
  "16": "16"
  "18.6-system-trixie": "18.6"
