# Service mesh (proxy and control plane images).
id: istio
name: "Istio"
images:
  - docker.io/istio/proxyv2
  - docker.io/istio/pilot
  - gcr.io/istio-release/proxyv2
  - gcr.io/istio-release/pilot
osv:
  - ecosystem: Go
    package: istio.io/istio
# Example tags and the version that must be read from them ("" = none).
testTags:
  "1.24.1": "1.24.1"
  "1.24.1-distroless": "1.24.1"
