# PHP runtime (official php images and Bitnami php-fpm).
id: php
name: "PHP"
images:
  - docker.io/library/php
  - docker.io/bitnami/php-fpm
nvd:
  cpes:
    - cpe:2.3:a:php:php
# Example tags and the version that must be read from them ("" = none).
testTags:
  "8.3.14-fpm-alpine": "8.3.14"
  "8.2-apache": "8.2"
  "fpm": ""
