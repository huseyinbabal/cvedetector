# Container registry.
id: harbor
name: "Harbor"
images:
  - docker.io/goharbor/harbor-core
  - docker.io/goharbor/harbor-portal
  - docker.io/goharbor/harbor-registryctl
  - docker.io/goharbor/harbor-jobservice
osv:
  - ecosystem: Go
    package: github.com/goharbor/harbor
# Example tags and the version that must be read from them ("" = none).
testTags:
  "v2.12.0": "2.12.0"
